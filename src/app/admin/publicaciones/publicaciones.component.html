<h2>Gestión de Publicaciones</h2>

<div *ngIf="publicaciones.length === 0">
    <p>No hay publicaciones activas.</p>
</div>

<ul class="list-group">
    <li *ngFor="let p of publicaciones" class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ p.titulo }}</strong> - {{ p.autor.nombre }}
            <p class="mb-0 text-muted">{{ p.contenido }}</p>
        </div>
        <button class="btn btn-danger btn-sm" (click)="banear(p.id!)">Banear</button>
    </li>
</ul>
