<h2>Publicaciones del Foro</h2>

<div class="row">
    <div class="col-md-4 mb-4" *ngFor="let publicacion of publicaciones">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ publicacion.titulo }}</h5>
                <p class="card-text">{{ publicacion.descripcion }}</p>
                <p class="text-muted">Autor: {{ publicacion.autor }}</p>
                <a [routerLink]="['/foro', publicacion.id]" class="btn btn-outline-primary btn-sm">Ver más</a>
            </div>
        </div>
    </div>
</div>
