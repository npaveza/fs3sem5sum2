<h2>{{ publicacion?.titulo }}</h2>
<p>{{ publicacion?.contenido }}</p>

<hr>

<h4>Comentarios</h4>

<ul class="list-group mb-3">
    <li class="list-group-item" *ngFor="let comentario of comentarios">
        <strong>{{ comentario.autor?.nombre }}:</strong> {{ comentario.contenido }}
    </li>
</ul>

<form [formGroup]="comentarioForm" (ngSubmit)="agregarComentario()">
    <div class="mb-3">
        <label class="form-label">Agregar comentario</label>
        <textarea formControlName="contenido" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Comentar</button>
</form>
