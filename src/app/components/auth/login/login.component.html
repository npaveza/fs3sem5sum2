<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Iniciar sesión</h2>

        <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input id="email" type="email" class="form-control" formControlName="email">
                <div class="text-danger" *ngIf="email.invalid && email.touched">
                    Correo inválido
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" formControlName="password">
                <div class="text-danger" *ngIf="password.invalid && password.touched">
                    Contraseña requerida
                </div>
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid">
                Iniciar sesión
            </button>
        </form>
    </div>
</div>
