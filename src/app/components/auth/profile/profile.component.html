<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Mi perfil</h2>

        <form [formGroup]="perfilForm" (ngSubmit)="guardarCambios()">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input class="form-control" formControlName="nombre">
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido</label>
                <input class="form-control" formControlName="apellido">
            </div>

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" formControlName="email">
            </div>

            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-control" formControlName="rol" [disabled]="true">
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" formControlName="contrasena">
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="perfilForm.invalid">
                Guardar cambios
            </button>
        </form>
    </div>
</div>
